name: Build

# ─── Triggers ────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: >
          OpenWrt version (Note: latest means build against latest release, not latest commit)
        required: true
        default: 'latest'

      target:
        description: 'Platform Target'
        required: true
        default: 'x86'

      subtarget:
        description: 'Platform Subtarget'
        required: true
        default: '64'

# ─── Global defaults ─────────────────────────────────────────────────────────
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: bash

jobs:
  # ── 1. Resolve "latest" to a concrete version tag ──────────────────────────
  resolve-version:
    name: Resolve OpenWrt version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - name: Resolve version tag
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.openwrt_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${INPUT_VERSION}" == "latest" ]]; then
            VERSION=$(gh release view --repo openwrt/openwrt --json tagName -q '.tagName' | sed 's/^v//')
            echo "Resolved 'latest' → ${VERSION}"
          else
            # Strip a leading 'v' if the user included one
            VERSION="${INPUT_VERSION#v}"
          fi

          # Basic sanity-check: must look like X.Y.Z
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '${VERSION}' does not match expected X.Y.Z format."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # ── 2. Build the package ───────────────────────────────────────────────────
  build:
    name: Build luci-app-opensoho (${{ needs.resolve-version.outputs.version }} · ${{ inputs.target }}/${{ inputs.subtarget }})
    needs: resolve-version
    runs-on: ubuntu-22.04

    env:
      OPENWRT_VERSION: ${{ needs.resolve-version.outputs.version }}
      TARGET:          ${{ inputs.target }}
      SUBTARGET:       ${{ inputs.subtarget }}
      PKG_NAME:        luci-app-opensoho

    steps:
      # ── 2a. Validate minimum OpenWrt version ─────────────────────────────
      # APK (the only supported format) requires OpenWrt 24.10+.
      - name: Validate minimum OpenWrt version
        run: |
          MAJOR=$(echo "${OPENWRT_VERSION}" | cut -d. -f1)
          MINOR=$(echo "${OPENWRT_VERSION}" | cut -d. -f2)
          if (( MAJOR < 24 )) || ( (( MAJOR == 24 )) && (( MINOR < 10 )) ); then
            echo "::error::This package requires OpenWrt 24.10 or newer (got ${OPENWRT_VERSION})."
            exit 1
          fi

      # ── 2b. Host build dependencies ───────────────────────────────────────
      - name: Install host build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses5-dev libssl-dev python3-distutils \
            python3-setuptools rsync swig unzip zlib1g-dev \
            file wget curl jq

      # ── 2c. Discover the SDK tarball URL ──────────────────────────────────
      - name: Discover SDK download URL
        id: sdk
        run: |
          BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET}/${SUBTARGET}"

          # The HTML listing contains the SDK filename; grep for it.
          LISTING=$(curl -fsSL "${BASE}/")

          SDK_FILE=$(echo "${LISTING}" \
            | grep -oP 'openwrt-sdk-[^"<>\s]+\.tar\.(xz|zst)' \
            | head -1)

          if [[ -z "${SDK_FILE}" ]]; then
            echo "::error::No SDK tarball found at ${BASE}/"
            echo "Listing snippet:"
            echo "${LISTING}" | grep -i sdk || echo "(nothing matched)"
            exit 1
          fi

          echo "sdk_url=${BASE}/${SDK_FILE}"   >> "$GITHUB_OUTPUT"
          echo "sdk_file=${SDK_FILE}"           >> "$GITHUB_OUTPUT"
          # Strip both .tar.xz and .tar.zst for the directory name
          SDK_DIR="${SDK_FILE%.tar.*}"
          SDK_DIR="${SDK_DIR%.tar}"
          echo "sdk_dir=${SDK_DIR}"             >> "$GITHUB_OUTPUT"
          echo "Found SDK: ${SDK_FILE}"

      # ── 2d. Cache the extracted SDK ───────────────────────────────────────
      - name: Cache SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: sdk/
          # Key includes the exact SDK filename, which encodes version + gcc ver
          key: sdk-${{ steps.sdk.outputs.sdk_file }}

      - name: Download & extract SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          wget -q "${{ steps.sdk.outputs.sdk_url }}" -O sdk_download

          mkdir -p sdk
          tar -xf sdk_download --strip-components=1 -C sdk
          rm sdk_download

      # ── 2e. Check out the current repo so feeds can reference it ──────────
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: src/luci-app-opensoho

      # ── 2f. Configure feeds ───────────────────────────────────────────────
      - name: Set up feeds
        working-directory: sdk
        run: |
          # Rewrite feeds.conf.default to only the feeds we actually need:
          #   packages         — provides rpcd (runtime dep) and base tooling
          #   luci             — provides luci-base (runtime dep)
          #   luci_opensoho_pkg — our package, via src-link into the local checkout
          #
          # Preserve the pinned commits from the SDK's original file so package
          # versions stay aligned with this OpenWrt release.
          grep -E '^src-(git|gz) packages ' feeds.conf.default \
            > feeds.conf.default.new
          grep -E '^src-(git|gz) luci ' feeds.conf.default \
            >> feeds.conf.default.new
          echo "src-link luci_opensoho_pkg ${{ github.workspace }}/src/luci-app-opensoho/luci" \
            >> feeds.conf.default.new
          mv feeds.conf.default.new feeds.conf.default

          ./scripts/feeds update packages luci luci_opensoho_pkg
          ./scripts/feeds install -a -p luci_opensoho_pkg
          # Install lucihttp's compile-time deps from the standard feeds so
          # that lua.h and ucode/module.h are present in the staging dir when
          # lucihttp (pulled in as a transitive dep of luci-base) is compiled.
          ./scripts/feeds install lua ucode luci-base rpcd

      # ── 2g. Generate .config ──────────────────────────────────────────────
      - name: Configure build
        working-directory: sdk
        run: |
          # Enable compile-time deps so make resolves the build order and
          # has their headers staged before lucihttp tries to include them.
          echo "CONFIG_PACKAGE_lua=m"       >> .config
          echo "CONFIG_PACKAGE_ucode=m"     >> .config
          echo "CONFIG_PACKAGE_luci-base=m" >> .config
          echo "CONFIG_PACKAGE_rpcd=m"      >> .config
          echo "CONFIG_PACKAGE_${PKG_NAME}=m" >> .config
          echo "CONFIG_USE_APK=y" >> .config

          make defconfig 2>&1 | grep -v "^#" | head -20 || true

      # ── 2h. Pre-build lucihttp's compile-time dependencies ───────────────
      # lucihttp (a transitive dep: luci-app-opensoho → luci-base → lucihttp)
      # is a C package that #includes lua.h and ucode/module.h.  Those headers
      # are staged only after lua and ucode themselves are compiled.  Running
      # them as explicit sequential steps guarantees their headers are present
      # in staging_dir/target-.../usr/include/ before lucihttp starts.
      - name: Pre-build lua and ucode
        working-directory: sdk
        run: |
          for pkg in lua ucode; do
            echo "--- building ${pkg} ---"
            # ./scripts/feeds install places packages at package/feeds/<feedname>/<pkg>,
            # NOT at package/<pkg>.  The make shorthand "package/<name>/compile" only
            # resolves direct children of package/, so it fails for feed-installed pkgs.
            # Find whichever path actually exists before calling make.
            PKG_PATH=$(find package -mindepth 1 -maxdepth 3 -type d -name "${pkg}" \
                         ! -path '*/.git/*' 2>/dev/null | head -1)
            if [[ -z "${PKG_PATH}" ]]; then
              echo "::error::Cannot find package directory for '${pkg}' — was 'feeds install' successful?"
              exit 1
            fi
            echo "Resolved ${pkg} → ${PKG_PATH}/compile"
            make "${PKG_PATH}/compile" V=s -j$(nproc) 2>&1 | tee "/tmp/${pkg}.log"
            if [[ ${PIPESTATUS[0]} -ne 0 ]]; then
              echo "::error::${pkg} build failed — last 40 lines:"
              tail -40 "/tmp/${pkg}.log"
              exit 1
            fi
          done

      # ── 2i. Build luci-app-opensoho ───────────────────────────────────────
      # luci-app-opensoho is a pure Lua/JSON package (PKGARCH:=all) — there is
      # nothing to compile.  The SDK just assembles the files into an APK.
      # lua and ucode are already staged above, so lucihttp will compile cleanly.
      - name: Build luci-app-opensoho package
        working-directory: sdk
        run: |
          make "package/${PKG_NAME}/compile" \
               V=s \
               -j$(nproc) \
               2>&1 | tee /tmp/build.log

          if [[ ${PIPESTATUS[0]} -ne 0 ]]; then
            echo "::error::Build failed — last 60 lines of log:"
            tail -60 /tmp/build.log
            exit 1
          fi

      # ── 2j. Collect artifacts ─────────────────────────────────────────────
      # PKGARCH:=all means the .apk lands under bin/packages/<arch>/…/all/
      # rather than a target-specific subdirectory, so search the full tree.
      - name: Collect built packages
        id: collect
        run: |
          mkdir -p artifacts

          find sdk/bin/packages -name "*.apk" | while read -r f; do
            cp -v "$f" artifacts/
          done

          COUNT=$(ls artifacts/ | wc -l)
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

          if [[ "${COUNT}" -eq 0 ]]; then
            echo "::error::No .apk files found under sdk/bin/packages/"
            find sdk/bin/ -type f | head -20
            exit 1
          fi

          echo "Built packages:"
          ls -lh artifacts/

      # ── 2k. Upload ────────────────────────────────────────────────────────
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: >-
            luci-app-opensoho_${{ env.OPENWRT_VERSION }}_${{ inputs.target }}_${{ inputs.subtarget }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      # ── 2l. Job summary ───────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## luci-app-opensoho build result

          | Field           | Value |
          |-----------------|-------|
          | OpenWrt version | \`${OPENWRT_VERSION}\` |
          | Target          | \`${TARGET}/${SUBTARGET}\` |
          | Packages built  | \`${{ steps.collect.outputs.count }}\` |

          $(ls artifacts/ 2>/dev/null | sed 's/^/- `/' | sed 's/$/`/')
          EOF