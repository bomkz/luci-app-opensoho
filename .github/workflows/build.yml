name: Build

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: >
          OpenWrt Version (Note: Latest means build against latest release, not commit)
        required: true
        default: latest
      target:
        description: >
          Platform Target
        required: true
        default: x86
      subtarget:
        description: >
          Platform Subtarget
        required: true
        default: "64"

jobs:
  build:
    name: Build (${{ github.event.inputs.openwrt_version }} · ${{ github.event.inputs.target }}/${{ github.event.inputs.subtarget }})
    runs-on: ubuntu-latest

    steps:
      # ── 0. Check out the repository ────────────────────────────────────────
      - name: Check out source
        uses: actions/checkout@v4

      # ── 1. Resolve "latest" → concrete version number ──────────────────────
      - name: Resolve OpenWrt version
        id: resolve
        env:
          INPUT_VERSION: ${{ github.event.inputs.openwrt_version }}
        run: |
          set -euo pipefail

          if [ "${INPUT_VERSION}" = "latest" ]; then
            echo "🔍 Discovering latest stable OpenWrt release …"

            # The GitHub Releases API is the most reliable source.
            LATEST=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/openwrt/openwrt/releases/latest" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'].lstrip('v'))")

            echo "✅ Latest release: ${LATEST}"
            echo "version=${LATEST}" >> "$GITHUB_OUTPUT"
          else
            echo "📌 Using pinned version: ${INPUT_VERSION}"
            echo "version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
          fi

      # ── 2. Install host build dependencies ─────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3-distutils python3-setuptools \
            rsync swig unzip zlib1g-dev file wget xz-utils

      # ── 3. Download & extract the OpenWrt SDK ──────────────────────────────
      - name: Download OpenWrt SDK
        id: sdk
        env:
          VERSION:    ${{ steps.resolve.outputs.version }}
          TARGET:     ${{ github.event.inputs.target }}
          SUBTARGET:  ${{ github.event.inputs.subtarget }}
        run: |
          set -euo pipefail

          BASE_URL="https://downloads.openwrt.org/releases/${VERSION}/targets/${TARGET}/${SUBTARGET}"
          echo "🔗 SDK index: ${BASE_URL}/"

          # Find the exact SDK tarball name from the directory listing.
          SDK_FILENAME=$(curl -fsSL "${BASE_URL}/" \
            | grep -oP 'openwrt-sdk-[^"]+\.tar\.(xz|zst)' \
            | head -1)

          if [ -z "${SDK_FILENAME}" ]; then
            echo "❌ No SDK found at ${BASE_URL}/"
            echo "   Check that the target/subtarget combination is valid for this release."
            exit 1
          fi

          echo "📦 SDK: ${SDK_FILENAME}"
          echo "sdk_filename=${SDK_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "sdk_dir=${SDK_FILENAME%.tar.*}"  >> "$GITHUB_OUTPUT"

          wget -q --show-progress "${BASE_URL}/${SDK_FILENAME}"

          # Decompress — handle both .xz and .zst transparently.
          case "${SDK_FILENAME}" in
            *.tar.xz)  tar -xJf "${SDK_FILENAME}" ;;
            *.tar.zst) tar --use-compress-program=unzstd -xf "${SDK_FILENAME}" ;;
            *)         tar -xf "${SDK_FILENAME}" ;;
          esac

      # ── 4. Stage the package inside the SDK feeds ──────────────────────────
      - name: Stage package in SDK
        env:
          SDK_DIR: ${{ steps.sdk.outputs.sdk_dir }}
        run: |
          set -euo pipefail

          PKG_SRC="$(pwd)/luci/luci-app-opensoho"
          PKG_DEST="${SDK_DIR}/package/luci-app-opensoho"

          echo "📂 Copying package → ${PKG_DEST}"
          cp -r "${PKG_SRC}" "${PKG_DEST}"

      # ── 5. Update feeds & install dependencies ─────────────────────────────
      - name: Update & install feeds
        env:
          SDK_DIR: ${{ steps.sdk.outputs.sdk_dir }}
        run: |
          set -euo pipefail
          cd "${SDK_DIR}"

          # Keep a record of what feeds are configured.
          cat feeds.conf.default || true

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # Explicitly (re-)install the package so its dependencies are pulled in.
          ./scripts/feeds install luci-app-opensoho || true

      # ── 6. Configure & build ───────────────────────────────────────────────
      - name: Build package
        env:
          SDK_DIR: ${{ steps.sdk.outputs.sdk_dir }}
        run: |
          set -euo pipefail
          cd "${SDK_DIR}"

          # Generate a minimal .config that selects our package.
          cat >> .config << 'EOF'
          CONFIG_PACKAGE_luci-app-opensoho=m
          EOF

          make defconfig

          echo "🔨 Building luci-app-opensoho …"
          make package/luci-app-opensoho/compile V=s -j$(nproc) 2>&1 \
            | tee /tmp/build.log \
            | tail -50
          echo "✅ Build finished."

      # ── 7. Collect built IPKs ──────────────────────────────────────────────
      - name: Collect artifacts
        env:
          SDK_DIR:    ${{ steps.sdk.outputs.sdk_dir }}
          VERSION:    ${{ steps.resolve.outputs.version }}
          TARGET:     ${{ github.event.inputs.target }}
          SUBTARGET:  ${{ github.event.inputs.subtarget }}
        run: |
          set -euo pipefail

          ARTIFACT_DIR="artifacts/${VERSION}/${TARGET}/${SUBTARGET}"
          mkdir -p "${ARTIFACT_DIR}"

          find "${SDK_DIR}/bin" -name "luci-app-opensoho*.ipk" \
            -exec cp {} "${ARTIFACT_DIR}/" \;

          # Also grab the build log.
          cp /tmp/build.log "${ARTIFACT_DIR}/build.log"

          echo "📦 Collected artifacts:"
          find "${ARTIFACT_DIR}" -type f

      # ── 8. Upload as a GitHub Actions artifact ─────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-opensoho_${{ steps.resolve.outputs.version }}_${{ github.event.inputs.target }}-${{ github.event.inputs.subtarget }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

      # ── 9. Summary ─────────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        env:
          VERSION:   ${{ steps.resolve.outputs.version }}
          TARGET:    ${{ github.event.inputs.target }}
          SUBTARGET: ${{ github.event.inputs.subtarget }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## luci-app-opensoho build summary

          | Field      | Value |
          |------------|-------|
          | OpenWrt    | \`${VERSION}\` |
          | Target     | \`${TARGET}/${SUBTARGET}\` |
          | Triggered  | ${{ github.actor }} |
          | Run        | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          EOF